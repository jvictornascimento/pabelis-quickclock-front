name: quickclock

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quickclock
      POSTGRES_USER: quickclock
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U quickclock -d quickclock']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ${QUICKCLOCK_BACKEND_PATH:-../../Spring/QuickClock}
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/quickclock
      DATABASE_USERNAME: quickclock
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      SERVER_PORT: '8080'
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Sao_Paulo
    depends_on:
      database:
        condition: service_healthy
    networks:
      - web
      - data
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '3', http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  frontend:
    build: .
    restart: unless-stopped
    ports:
      - '${QUICKCLOCK_BIND_IP:-127.0.0.1}:${QUICKCLOCK_PORT:-8088}:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - web

volumes:
  database_data:

networks:
  web:
  data:
    internal: true
